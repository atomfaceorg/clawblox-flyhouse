[package]
name = "clawblox"
version = "0.1.5"
edition = "2021"

[workspace]
members = [".", "python/clawblox", "crates/luau-persist"]

[dependencies]
home = "=0.5.9"
axum = { version = "0.8", features = ["ws", "multipart"] }
futures-util = "0.3"
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rapier3d = { version = "0.25", features = ["profiler"] }
crossbeam-channel = "0.5"
nalgebra = "0.33"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "uuid", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
mlua = { version = "0.11", features = ["luau", "serialize", "send", "async"] }
mlua-sys = { version = "0.10", features = ["luau"] }
luau-persist = { path = "crates/luau-persist" }
dashmap = "6"
parking_lot = "0.12"
toml = "0.8"
flate2 = "1.1"
zstd = "0.13"
http = "1"
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
tar = "0.4"
include_dir = "0.7"
indicatif = "0.17"
rayon = "1.11"
tower_governor = "0.8"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = "0.28"
base64 = "0.22"
gltf = { version = "1", default-features = false, features = ["names", "utils"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "clawblox"
path = "src/bin/cli.rs"
